# Casos de prueba de permisos del motor de habilidades (prototipo, ronda 3).
# Cada caso: quién (usuario con grupos de Odoo), canal, herramienta pedida, argumentos, contexto y el
# resultado esperado: permitir | confirmar | confirmar_fuera_de_banda | escalar | bloquear (+ motivo).
# `contaminado: true` = en este turno entró contenido de terceros (adjunto, ficha editada por un
# cliente, resultado de leer_archivo): toda escritura pasa a confirmación (defensa B-07/S-10).
# `precio_lista` sirve para calcular el descuento implícito de un precio menor al de lista.

usuarios:
  ana_vendedora: {grupos: [dcasa_base.group_vendedora]}
  gaby_gerencia: {grupos: [dcasa_base.group_gerencia]}
  carlos_contador: {grupos: [account.group_account_manager, sales_team.group_sale_salesman_all_leads, stock.group_stock_user]}
  dueno_admin: {grupos: [base.group_system, sales_team.group_sale_manager, account.group_account_manager, stock.group_stock_manager, purchase.group_purchase_manager]}
  pedro_sin_perfil: {grupos: [sales_team.group_sale_salesman, stock.group_stock_user]}   # el «vendedor» de hoy (ROLES)

casos:
  - {id: P01, usuario: ana_vendedora, canal: chat, herramienta: crear_cotizacion, args: {cliente: Juan, producto: SOF-001, precio: 300}, contexto: {precio_lista: 300}, esperado: permitir}
  - {id: P02, usuario: ana_vendedora, canal: chat, herramienta: crear_cotizacion, args: {cliente: Juan, producto: SOF-001, precio: 255}, contexto: {precio_lista: 300}, esperado: escalar, motivo: tope_descuento}
  - {id: P03, usuario: ana_vendedora, canal: chat, herramienta: confirmar_venta, args: {venta: S00012}, contexto: {total: 450}, esperado: confirmar}
  - {id: P04, usuario: ana_vendedora, canal: chat, herramienta: reporte_contable, args: {reporte: balance_general}, esperado: bloquear, motivo: odoo}
  - {id: P05, usuario: ana_vendedora, canal: chat, herramienta: ventas_por_vendedora, args: {periodo: mes}, esperado: bloquear, motivo: odoo}
  - {id: P06, usuario: ana_vendedora, canal: chat, herramienta: crear_factura, args: {tipo: proveedor, tercero: Muebles SA, producto: SOF-001}, esperado: bloquear, motivo: restriccion}
