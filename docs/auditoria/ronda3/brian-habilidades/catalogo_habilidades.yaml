# Lo que Brian NUNCA hace (no es herramienta: no existe forma de pedirlo; política dura en servidor).
nunca:
  - Ejecutar Python, SQL, shell o expresiones arbitrarias (ir.actions.server tipo code, base.automation con code, QWeb libre).
  - Escribir en ir.rule, ir.model.access, res.groups, ir.config_parameter, ir.cron, ir.module.module, ir.mail_server ni claves.
  - Borrar o editar asientos, pagos, conciliaciones, el libro de puntos (dcasa.movimiento) o el registro de acciones (brian.accion).
  - Ver, generar o cambiar contraseñas, PIN de socios, DCASA_PIN_PEPPER, tokens, claves de API.
  - Instalar o desinstalar módulos.
  - Cambiar cifras del programa Socios (data/puntos.json vive en git).
  - Enviar mensajes (WhatsApp, correo, Telegram) a clientes sin que una persona los mande.
  - Actuar como otro usuario o subir su propio nivel de ayuda o el de cualquiera.
  - Publicar precios, cifras o testimonios que no salgan de Odoo.
  - Tocar al administrador o a la persona que conversa (roles, desactivar).
