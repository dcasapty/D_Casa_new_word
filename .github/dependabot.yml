# Actualizaciones automáticas de dependencias (I-17, I-18). Cada PR de Dependabot pasa
# por el CI completo (tests + imagen + simulacro) antes de que alguien lo apruebe.
version: 2
updates:
  # Acciones de GitHub: van fijadas por SHA en los workflows; Dependabot sube el SHA
  # y el comentario con la versión.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Panama
    commit-message:
      prefix: "CI"
    labels: [dependencias]
    groups:
      acciones:
        patterns: ["*"]

  # Worker de Cloudflare (wrangler, @cloudflare/containers, tipos, vitest).
  - package-ecosystem: npm
    directory: /edge
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Panama
    commit-message:
      prefix: "Borde"
    labels: [dependencias]
    open-pull-requests-limit: 5
    # Todo corre en Node 22 (CI, contenedor, despliegue): @types/node de otra versión mayor rompe el typecheck
    # (URL y Buffer chocan con workers-types; 2026-11-06, PR #79 y #81). Se sube a mano junto con Node.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      desarrollo:
        dependency-type: development
        exclude-patterns: ["wrangler", "@cloudflare/*"]

  # Juan, el asistente de los clientes (auditoría 2026-11-06: tenía dos avisos de seguridad sin vigilar).
  - package-ecosystem: npm
    directory: /juan
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Panama
    commit-message:
      prefix: "Juan"
    labels: [dependencias]
    open-pull-requests-limit: 5
    # Todo corre en Node 22 (CI, contenedor, despliegue): @types/node de otra versión mayor rompe el typecheck
    # (URL y Buffer chocan con workers-types; 2026-11-06, PR #79 y #81). Se sube a mano junto con Node.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      ia:
        patterns: ["ai", "@ai-sdk/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      desarrollo:
        dependency-type: development
        exclude-patterns: ["wrangler", "@cloudflare/*"]

  # Puente de WhatsApp por QR (Worker) y su contenedor (Node). Opcional: no está en producción.
  - package-ecosystem: npm
    directory: /puente-wa
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Panama
    commit-message:
      prefix: "Puente"
    labels: [dependencias]
    # Todo corre en Node 22 (CI, contenedor, despliegue): @types/node de otra versión mayor rompe el typecheck
    # (URL y Buffer chocan con workers-types; 2026-11-06, PR #79 y #81). Se sube a mano junto con Node.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      todo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /puente-wa/contenedor
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Panama
    commit-message:
      prefix: "Puente"
    labels: [dependencias]
    groups:
      todo:
        patterns: ["*"]

  # Imagen base de docker/Dockerfile (ubuntu). Ojo: subir de PostgreSQL 16 a otra versión
  # mayor NO es una actualización normal (requiere pg_upgrade y un respaldo nuevo):
  # esos PR se cierran, no se aprueban (docs/OPERACION.md).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Panama
    commit-message:
      prefix: "Imagen"
    labels: [dependencias]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
