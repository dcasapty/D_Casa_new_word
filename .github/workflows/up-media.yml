name: up media

# La dueña sube fotos y Excel a «up media/» desde GitHub (Add file → Upload files), sin terminal.
# Con cada push a main que toque esa carpeta, este workflow:
#   1. corre scripts/procesar_up_media.py: regenera el catálogo (catalogo.json, fotos optimizadas,
#      docs/CATALOGO_REVISAR.md), mueve con `git mv` lo procesado a fuentes/<pedido>/ o a
#      descartado/<fecha>/ (motivo en su LEEME.md) y escribe «up media/RESUMEN.md» (qué foto fue
#      a qué producto, qué quedó pendiente y por qué, qué Excel se cargó);
#   2. prueba el resultado: tests unitarios del procesador y scripts/test.sh dcasa_catalogo (instala
#      el módulo con el catálogo recién generado en una base limpia);
#   3. solo si todo pasó, hace commit del resultado y lo empuja a main (GITHUB_TOKEN);
#   4. construye la imagen de ESE commit y la despliega a staging con desplegar.yml. Producción no:
#      a producción se llega con un despliegue aprobado desde CI/CD (ci.yml).
#
# Si los tests fallan, no se hace commit: la bandeja queda como la subió la dueña, el RESUMEN que
# se habría escrito queda en el resumen de la ejecución y en un artefacto, y hay que mirar el log.
#
# Sin bucles: un push hecho con GITHUB_TOKEN no dispara otros workflows, y además el commit del bot
# lleva «[skip up-media] [skip ci]» (por si algún día se empuja con un PAT). Un PAT solo hace falta
# si main tiene protección de rama que GITHUB_TOKEN no puede saltar (PR obligatorio, firmas):
# token fino con «Contents: read and write» sobre este repositorio y permiso de bypass, guardado como
# secreto UP_MEDIA_TOKEN; el checkout lo usa si existe.
#
# Las acciones van fijadas por SHA (mismas versiones que ci.yml; Dependabot las actualiza).
# Operación: docs/OPERACION.md › «Cómo subir fotos». Detalle del catálogo: docs/CATALOGO.md.

on:
  push:
    branches: [main]
    paths: ["up media/**"]
  workflow_dispatch:

# Una subida detrás de otra: cada ejecución parte del main que dejó la anterior (ref: main).
concurrency:
  group: up-media
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  procesar:
    name: Procesar la bandeja y probar el catálogo
    if: ${{ !contains(github.event.head_commit.message, '[skip up-media]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      hubo_cambios: ${{ steps.commit.outputs.hubo_cambios }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Siempre la punta de main (no el SHA del push): así una subida detrás de otra no pisa
          # el commit que dejó la ejecución anterior.
          ref: ${{ github.ref_name }}
          submodules: true
          token: ${{ secrets.UP_MEDIA_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vendor/odoo/requirements.txt
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev libpq-dev postgresql-client
      - name: Dependencias de Odoo (traen openpyxl y Pillow, las del importador)
        run: pip install -r vendor/odoo/requirements.txt -r docker/requirements-dcasa.txt

      - name: Procesar «up media/» (catálogo, movimientos y RESUMEN.md)
        run: |
          python scripts/procesar_up_media.py | tee "$RUNNER_TEMP/procesar.log"
          {
            echo "## up media"
            echo ""
            echo '```'
            tail -1 "$RUNNER_TEMP/procesar.log"
            echo '```'
            echo ""
            cat "up media/RESUMEN.md"
          } >> "$GITHUB_STEP_SUMMARY"
          git status --short | head -50
      - name: Tests del procesador
        run: python -m unittest discover -s scripts/tests -v
      - name: Instalar dcasa_catalogo con el catálogo nuevo y correr sus tests
        run: |
          printf '[options]\nserver_wide_modules = base,web,dcasa_sesiones\n' > "$ODOO_RC"
          scripts/test.sh dcasa_catalogo
        env:
          DB_HOST: localhost
          PYTHON: python
          ODOO_RC: ${{ runner.temp }}/odoo-ci.conf
          LOG: ${{ runner.temp }}/odoo-test.log
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: up-media-fallido-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/odoo-test.log
            ${{ runner.temp }}/procesar.log
            up media/RESUMEN.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit del resultado y push a main
        id: commit
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Nada cambió: no hay commit."
            echo "hubo_cambios=false" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          resumen="$(tail -1 "$RUNNER_TEMP/procesar.log")"
          git -c user.name='dcasa-up-media[bot]' -c user.email='dcasa-up-media[bot]@users.noreply.github.com' \
            commit -q -m "up media: catálogo regenerado y bandeja ordenada [skip up-media] [skip ci]" \
                      -m "$resumen" \
                      -m "Procesado por .github/workflows/up-media.yml (ejecución ${GITHUB_RUN_ID}) tras ${GITHUB_SHA}. Detalle: up media/RESUMEN.md."
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "hubo_cambios=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Commit del bot: $(git rev-parse HEAD)"

  imagen:
    name: Imagen Docker del commit procesado
    needs: procesar
    if: needs.procesar.outputs.hubo_cambios == 'true'
    runs-on: ubuntu-24.04
    outputs:
      imagen_id: ${{ steps.imagen.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.procesar.outputs.commit }}
          submodules: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Construir imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          tags: dcasa-odoo:ci
          load: true
          cache-from: type=gha,scope=imagen
          cache-to: type=gha,mode=max,scope=imagen
      - name: ID de la imagen
        id: imagen
        run: |
          id="$(docker image inspect dcasa-odoo:ci --format '{{.Id}}')"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Imagen: $id"
      - name: Guardar la imagen para el despliegue
        run: |
          docker save dcasa-odoo:ci | zstd -T0 -3 -q -o "$RUNNER_TEMP/imagen.tar.zst"
          ls -lh "$RUNNER_TEMP/imagen.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: imagen-odoo-${{ needs.procesar.outputs.commit }}
          path: ${{ runner.temp }}/imagen.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  desplegar-staging:
    name: Desplegar a staging
    needs: [procesar, imagen]
    if: needs.procesar.outputs.hubo_cambios == 'true'
    uses: ./.github/workflows/desplegar.yml
    with:
      entorno: staging
      artefacto: imagen-odoo-${{ needs.procesar.outputs.commit }}
      imagen_id: ${{ needs.imagen.outputs.imagen_id }}
      app_version: ${{ needs.procesar.outputs.commit }}
      respaldo_previo: true
    secrets: inherit
