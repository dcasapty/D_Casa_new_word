name: Previsualización

# Levanta la imagen real de producción con datos de demostración en el runner.
#
# Solo a mano (Actions → Previsualización → Run workflow): saca capturas y abre un
# túnel temporal de Cloudflare con un link en línea durante los minutos que elijas
# (máximo 60), con el sitio, la tienda, /socios y el backend de Odoo.
# No corre en cada push: los minutos de GitHub Actions se reservan para los tests.
# El sitio de verdad vive en Cloudflare (docs/DESPLIEGUE.md).
#
# Es una base de prueba que se destruye al terminar: nada de esto toca producción.

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos que el link queda en línea (máximo 60)"
        required: true
        default: "30"

permissions:
  contents: read
  pull-requests: write  # para comentar el link en el PR

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Previsualizar el sitio
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EN_LINEA: 'true'
      MINUTOS: ${{ inputs.minutos || '30' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Construir la imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          tags: dcasa-odoo:preview
          load: true
          cache-from: type=gha,scope=imagen
          cache-to: type=gha,mode=max,scope=imagen

      - name: Abrir el túnel de Cloudflare
        id: tunel
        if: env.EN_LINEA == 'true'
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:8069 > tunel.log 2>&1 &
          for _ in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then cat tunel.log; echo "::error::No se pudo abrir el túnel."; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "LINK DE PREVISUALIZACIÓN: $URL (listo en unos minutos, cuando arranque Odoo)"

      # El repositorio es público: sus logs también. Con el secreto PREVIEW_ADMIN_PASSWORD la
      # clave del admin es esa (GitHub la tapa con ***) y Brian usa BRIAN_API_KEY_PRUEBAS (o, si
      # no existe, BRIAN_API_KEY). Sin ese secreto: clave al azar visible y Brian sin IA,
      # para que nadie gaste la clave de IA con una contraseña publicada.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: S3 local en lugar de R2
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends stunnel4
          pip install "moto[server]>=5,<6" boto3
          .github/scripts/s3_local.sh "$RUNNER_TEMP/s3" 9100 dcasa-preview

      - name: Arrancar Odoo con una base nueva
        id: odoo
        env:
          CLAVE_PRIVADA: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
          BRIAN_CLAVE: ${{ secrets.BRIAN_API_KEY_PRUEBAS || secrets.BRIAN_API_KEY }}
        run: |
          if [ -n "$CLAVE_PRIVADA" ]; then
            CLAVE="$CLAVE_PRIVADA"
            echo "clave=la del secreto PREVIEW_ADMIN_PASSWORD" >> "$GITHUB_OUTPUT"
            BRIAN=(-e BRIAN_PROVEEDOR=anthropic -e BRIAN_API_KEY="$BRIAN_CLAVE")
            [ -z "$BRIAN_CLAVE" ] && BRIAN=()
          else
            CLAVE=$(openssl rand -hex 6)
            echo "clave=$CLAVE" >> "$GITHUB_OUTPUT"
            BRIAN=()
          fi
          # La imagen trae su propio PostgreSQL (Fase 1); los respaldos van a un S3 local
          # desechable, igual que la prueba de humo de ci.yml (VERIFICAR AL INTEGRAR con f1-imagen).
          docker run -d --name odoo --network host \
            -e ADMIN_PASSWORD="$CLAVE" -e ADMIN_USER_PASSWORD="$CLAVE" -e APP_VERSION=${{ github.sha }} \
            -e ODOO_MASTER_PASSWORD="$(openssl rand -hex 16)" -e DCASA_PIN_PEPPER=preview \
            -e R2_ENDPOINT=https://127.0.0.1:9100 -e R2_BUCKET=dcasa-preview \
            -e R2_ACCESS_KEY_ID=preview -e R2_SECRET_ACCESS_KEY=preview \
            -e PGBACKREST_CIPHER_PASS="$(openssl rand -hex 32)" \
            -e PGBACKREST_REPO1_STORAGE_VERIFY_TLS=n \
            -e RESPALDO_TOKEN="$(openssl rand -hex 32)" "${BRIAN[@]}" \
            dcasa-odoo:preview
          for _ in $(seq 1 120); do
            curl -fsS -o /dev/null http://localhost:8069/web/health 2>/dev/null && { echo "Odoo arriba"; break; }
            sleep 5
          done
          curl -fsS -o /dev/null http://localhost:8069/web/health

      - name: Cargar datos de demostración
        run: |
          docker exec -i -e PREVIEW_URL="${{ steps.tunel.outputs.url }}" odoo \
            python3 /opt/odoo/odoo-bin shell -c /var/lib/odoo/odoo.conf -d dcasa --log-level=warn \
            < scripts/demo_data.py

      - name: Publicar el link en el PR
        if: env.EN_LINEA == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --body "$(cat <<CUERPO
          ### Previsualización en línea (${MINUTOS} min)

          **${{ steps.tunel.outputs.url }}**

          | Qué | Dónde | Acceso |
          |---|---|---|
          | Sitio y tienda | ${{ steps.tunel.outputs.url }}/ | — |
          | App del socio | ${{ steps.tunel.outputs.url }}/socios | celular \`6555-1234\` · PIN \`482915\` |
          | Backend de Odoo | ${{ steps.tunel.outputs.url }}/web/login | usuario \`admin\` · clave \`${{ steps.odoo.outputs.clave }}\` |

          Base de prueba con el catálogo real (Excel + fotos de \`up media\`); los socios «Demo» y su
          factura son de ejemplo. Se borra al terminar la ejecución.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          CUERPO
          )"

      - name: Capturas
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/preview_shots.py http://localhost:8069 capturas
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: capturas-del-sitio
          path: capturas/

      - name: Resumen
        run: |
          {
            echo "## Previsualización de D'CASA"
            if [ "$EN_LINEA" = "true" ]; then
              echo ""
              echo "**Link en línea ($MINUTOS min):** ${{ steps.tunel.outputs.url }}"
              echo ""
              echo "| Qué | Dónde | Acceso |"
              echo "|---|---|---|"
              echo "| Sitio y tienda | ${{ steps.tunel.outputs.url }}/ | — |"
              echo "| App del socio | ${{ steps.tunel.outputs.url }}/socios | celular \`6555-1234\` · PIN \`482915\` |"
              echo "| Backend de Odoo | ${{ steps.tunel.outputs.url }}/web/login | usuario \`admin\` · clave \`${{ steps.odoo.outputs.clave }}\` |"
              echo ""
              echo "La base es de prueba y se borra cuando termina este job."
            fi
            echo ""
            echo "Capturas de escritorio y móvil: artefacto **capturas-del-sitio** de esta ejecución."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mantener en línea
        if: env.EN_LINEA == 'true'
        run: |
          # Solo un número entero de 1 a 60 (I-19); cualquier otra cosa → 30.
          MIN=$MINUTOS
          if ! [[ "$MIN" =~ ^[0-9]{1,3}$ ]] || [ "$MIN" -lt 1 ]; then MIN=30; fi
          if [ "$MIN" -gt 60 ]; then MIN=60; fi
          echo "En línea en ${{ steps.tunel.outputs.url }} durante $MIN minutos."
          sleep $((MIN * 60))

      - if: failure()
        run: docker logs odoo 2>&1 | tail -200
