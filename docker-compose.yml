# Entorno local completo: PostgreSQL + Odoo con los módulos de D'CASA.
#   docker compose up --build        → http://localhost:8069  (admin / admin)
# Opcional, exponerlo por un túnel de Cloudflare (alternativa a Containers):
#   CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile tunnel up -d

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dcasa
      POSTGRES_PASSWORD: dcasa
      POSTGRES_DB: dcasa
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcasa"]
      interval: 5s
      retries: 10

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: dcasa
      DB_PASSWORD: dcasa
      DB_NAME: dcasa
      DB_SSLMODE: disable
      ADMIN_PASSWORD: admin
      APP_VERSION: local
    ports:
      - "8069:8069"
    volumes:
      # Los módulos propios se montan desde el repo para desarrollar sin reconstruir.
      - ./addons:/opt/dcasa/addons:ro
    command: ["--dev=xml"]

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - odoo

volumes:
  db-data:
